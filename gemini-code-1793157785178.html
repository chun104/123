<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球物理通論 | 臺北市立大學</title>
    <!-- 引入 Google Fonts 與 Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>
        /* CSS 變數定義 (Google 品牌色與 Material Design 風格) */
        :root {
            --google-blue: #4285F4;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --google-green: #34A853;
            --bg-color: #F8F9FA;
            --surface-color: #FFFFFF;
            --text-primary: #202124;
            --text-secondary: #5F6368;
            --border-color: #DADCE0;
            --shadow-sm: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --border-radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 導覽列 */
        header {
            background-color: var(--surface-color);
            padding: 16px 24px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo-icon {
            color: var(--google-blue);
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--google-blue);
        }

        /* 共用 Section 樣式 */
        section {
            padding: 80px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 48px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Hero 區塊 */
        .hero {
            margin-top: 60px;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #fceceb 0%, #eef3fc 50%, #eefaf0 100%);
            border-radius: 0 0 40px 40px;
            padding: 100px 24px;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 16px;
            background: -webkit-linear-gradient(45deg, var(--google-blue), var(--google-red), var(--google-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p.subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin-bottom: 32px;
        }

        .chips {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 32px;
        }

        .chip {
            background: var(--surface-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 三大核心目標卡片 */
        .objectives-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--surface-color);
            padding: 32px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            border-top: 4px solid var(--google-blue);
        }

        .card:nth-child(2) { border-top-color: var(--google-red); }
        .card:nth-child(3) { border-top-color: var(--google-yellow); }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .card-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .card:nth-child(1) .card-icon { color: var(--google-blue); }
        .card:nth-child(2) .card-icon { color: var(--google-red); }
        .card:nth-child(3) .card-icon { color: var(--google-yellow); }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 16px;
        }

        .card ul {
            list-style: none;
        }

        .card ul li {
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .card ul li::before {
            content: "check_circle";
            font-family: 'Material Symbols Outlined';
            font-size: 18px;
            color: var(--google-green);
            margin-top: 2px;
        }

        /* 互動式圖解：AI 工作流 */
        .workflow-container {
            background: var(--surface-color);
            padding: 48px;
            border-radius: 24px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .workflow-flow {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 32px;
        }

        .wf-node {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .wf-node:hover {
            border-color: var(--google-blue);
            background: #e8f0fe;
        }

        .wf-node .material-symbols-outlined {
            font-size: 32px;
            color: var(--google-blue);
        }

        .wf-arrow {
            color: var(--text-secondary);
            font-size: 32px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; color: var(--google-blue); }
            100% { transform: scale(1); opacity: 0.5; }
        }

        /* 課程大綱時間軸 */
        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 4px;
            background-color: var(--border-color);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -2px;
            border-radius: 2px;
        }

        .timeline-item {
            padding: 10px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
        }

        .timeline-item:nth-child(odd) {
            left: 0;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            right: -10px;
            background-color: var(--surface-color);
            border: 4px solid var(--google-blue);
            top: 15px;
            border-radius: 50%;
            z-index: 1;
            box-shadow: var(--shadow-sm);
        }

        .timeline-item:nth-child(even)::after {
            left: -10px;
        }

        .timeline-content {
            padding: 24px;
            background-color: var(--surface-color);
            position: relative;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .timeline-content:hover {
            box-shadow: var(--shadow-md);
            transform: scale(1.02);
        }

        .timeline-content h4 {
            color: var(--google-blue);
            margin-bottom: 8px;
            font-size: 1.25rem;
        }
        
        .timeline-content .date {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: bold;
            margin
